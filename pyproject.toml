[project]
name = "greek-idioms"
version = "0.2.0"
description = "Literal vs. idiomatic classification of Modern Greek expressions with and without context"
requires-python = ">=3.10"
# mlx-lm runs the models on Apple Silicon Macs
dependencies = ["mlx-lm", "matplotlib"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
